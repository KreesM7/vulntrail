[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vulntrail"
version = "0.1.0"
description = "Local-first continuous vulnerability scanning with traceable evidence and history"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "KreesM7"}]
dependencies = ["PyYAML>=6.0.2,<7", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "textual>=0.80,<10"]
[project.scripts]
vulntrail = "vulntrail.cli:main"
[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "build>=1,<2", "ruff>=0.8,<1", "pip-audit>=2.7,<3"]

[project.urls]
Repository = "https://github.com/KreesM7/vulntrail"
Issues = "https://github.com/KreesM7/vulntrail/issues"

[tool.setuptools.packages.find]
include = ["vulntrail*"]


[tool.setuptools.package-data]
vulntrail = ["static/*"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
